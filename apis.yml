aid: lane
name: Lane
description: Lane is a workplace experience platform for commercial real estate, now operated as VTS Activate
  after VTS acquired the company. The product gives building tenants a single mobile and web app for
  keyless building, suite and room access, booking amenities and shared spaces such as meeting rooms,
  fitness studios and desks, inviting and checking in visitors, receiving building information,
  maintenance updates and alerts, and RSVPing to events or ordering and paying for retail and food
  service. Landlords and property managers use it as the tenant-facing layer over the VTS commercial
  real estate platform. The legal entity behind the apps is VTS LANE INC. and the joinlane.com
  application traffic is served by the VTS Activate platform at activate.vts.com. Lane publishes no
  public developer portal, API documentation, OpenAPI definition or SDKs; the product is delivered as
  a first-party mobile and web application backed by an internal GraphQL API.
